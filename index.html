  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f7f2e9" />

  <!-- Apply the saved light/dark theme before first paint (no flash). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ys-portfolio-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#2b241c" : "#f7f2e9");
      } catch (e) { /* keep the default light theme */ }
    })();
  </script>

  <title>Yovenzor Singh — Estudiante de Instalaciones Eléctricas y Automáticas</title>
  <meta name="description"
